<!doctype html>
<!-- TODO: Groups for transactions, that can be collapsed -->
<html>
  <head>
    <title>$cenarios</title>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #222;
        --muted: #555;
        --muted2: #999;
        --border: #ccc;
        --th-bg: #f5f5f5;
        --group-bg: #eef2ff;
        --surface: #fff;
        --field-bg: #fff;
        --hover: #eef2ff;
        --sep: #eee;
        --danger: #c00;
        --danger-soft: #d99;
        --shadow: rgba(0, 0, 0, 0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1b1e;
          --fg: #e6e6e6;
          --muted: #b3b6bb;
          --muted2: #888c92;
          --border: #3a3d42;
          --th-bg: #25262b;
          --group-bg: #2a3050;
          --surface: #25262b;
          --field-bg: #1f2024;
          --hover: #2f3442;
          --sep: #34363c;
          --danger: #ff7676;
          --danger-soft: #a06060;
          --shadow: rgba(0, 0, 0, 0.5);
        }
      }

      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 1.5rem;
        color: var(--fg);
        background: var(--bg);
      }

      /* two-column layout: accounts+chart left, transactions right */
      .layout {
        display: flex;
        gap: 2rem;
        align-items: flex-start;
      }
      .left {
        flex: 1 1 0;
        min-width: 0;
      } /* min-width:0 lets the chart shrink */
      .right {
        flex: 1 1 0;
        min-width: 900px;
      }

      h3 {
        margin: 0 0 0.5rem;
      }

      /* tables */
      table {
        border-collapse: collapse;
        margin-bottom: 0.5rem;
        width: 100%;
      }
      th,
      td {
        border: 1px solid var(--border);
        padding: 4px 8px;
        text-align: left;
      }
      th {
        background: var(--th-bg);
        font-weight: 600;
      }

      /* inputs + dropdowns inside cells */
      input,
      select {
        width: 90px;
        box-sizing: border-box;
        padding: 2px 4px;
      }
      input[type="number"] {
        width: 80px;
      }

      /* buttons */
      button {
        cursor: pointer;
        padding: 4px 10px;
      }
      button[data-del] {
        padding: 2px 6px;
      } /* the ✕ row-delete buttons */

      /* years + reset row */
      .controls {
        margin: 1rem 0;
      }
      .controls label {
        margin-right: 1rem;
      }
      .charts {
        height: 500px;
        width: 50%;
      }

      /* transaction groups */
      .group-head td {
        background: var(--group-bg);
        font-weight: 600;
      }
      .group-head .head-inner {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .caret {
        cursor: pointer;
        display: inline-block;
        width: 1em;
        user-select: none;
      }
      .group-name {
        width: auto;
        min-width: 600px;
        font-weight: 600;
        color: inherit;
        border: 1px solid transparent;
        background: transparent;
      }
      .group-name:hover,
      .group-name:focus {
        border: 1px solid var(--border);
        background: var(--field-bg);
      }
      .group-tools {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }
      .group-tools .grp-active-wrap {
        display: inline-flex;
        align-items: center;
        gap: 0.2rem;
        font-weight: 400;
        font-size: 0.85em;
        color: var(--muted);
        cursor: pointer;
      }
      .group-tools .grp-active {
        width: auto;
        cursor: pointer;
      }
      .group-tools button {
        padding: 0 7px;
        line-height: 1.5;
      }
      .grp-disabled .group-name {
        text-decoration: line-through;
        color: var(--muted2);
      }
      tr.grp-row.grp-disabled td {
        opacity: 0.45;
      }
      .row-actions {
        white-space: nowrap;
      }
      /* per-row action menu */
      .row-menu {
        position: relative;
        display: inline-block;
      }
      .row-menu > summary {
        list-style: none;
        cursor: pointer;
        padding: 2px 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--surface);
        user-select: none;
      }
      .row-menu > summary::-webkit-details-marker {
        display: none;
      }
      .row-menu .menu {
        position: absolute;
        right: 0;
        top: 100%;
        z-index: 50;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: 0 4px 12px var(--shadow);
        min-width: 150px;
        padding: 4px;
      }
      .row-menu .menu button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        width: 100%;
        text-align: left;
        color: inherit;
        border: none;
        background: none;
        padding: 5px 8px;
        border-radius: 4px;
        white-space: nowrap;
      }
      .row-menu .menu button:hover {
        background: var(--hover);
      }
      .row-menu .menu .sc {
        color: var(--muted2);
        font-size: 0.78em;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }
      .row-menu .menu .danger {
        color: var(--danger);
      }
      .row-menu .menu .danger .sc {
        color: var(--danger-soft);
      }
      .row-menu .menu .sep {
        height: 1px;
        background: var(--sep);
        margin: 4px 0;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <!-- LEFT: accounts + controls + chart -->
      <div class="left">
        <div class="controls">
          <label>Start year <input id="start-year" type="number" /></label>
          <label>Years <input id="years" type="number" value="20" /></label>
          <button id="reset">Reset all</button>
          <button id="export">Export CSV</button>
          <button id="import-btn">Import CSV</button>
          <input id="import-file" type="file" accept=".csv" hidden />
        </div>
        <canvas id="chart"></canvas>
        <h3>Accounts</h3>
        <table>
          <thead>
            <tr id="acc-head"></tr>
          </thead>
          <tbody id="acc-rows"></tbody>
        </table>
        <button id="acc-add">+ Account</button>
      </div>

      <!-- RIGHT: transactions, full height -->
      <div class="right">
        <h3>Transactions</h3>
        <table>
          <thead>
            <tr id="tx-head"></tr>
          </thead>
          <tbody id="tx-rows"></tbody>
        </table>
        <button id="tx-add">+ Transaction</button>
        <button id="tx-add-group">+ Group</button>
      </div>
    </div>
    <script>
      // -- Muscle memory reward
      // ── one-time setup ──
      const cvs = document.createElement("canvas");
      cvs.style.cssText =
        "position:fixed;inset:0;pointer-events:none;z-index:9999";
      document.body.appendChild(cvs);
      const ctx = cvs.getContext("2d");
      const resize = () => {
        cvs.width = innerWidth;
        cvs.height = innerHeight;
      };
      resize();
      addEventListener("resize", resize);

      const EMOJIS = ["💵", "🤑", "💰", "📈", "🎉", "✨", "💸"];
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

      let parts = [],
        running = false;

      function confetti(n = 10) {
        const em = pick(EMOJIS);
        const _x = Math.random() * innerWidth;

        for (let i = 0; i < n; i++) {
          parts.push({
            x: _x,
            y: innerHeight / 2,
            vx: (Math.random() - 0.5) * 14,
            vy: Math.random() * -12 - 4,
            rot: Math.random() * Math.PI,
            vr: (Math.random() - 0.5) * 0.3,
            size: 18 + Math.random() * 18,
            emoji: em,
          });
        }
        if (!running) {
          running = true;
          requestAnimationFrame(tick);
        }
      }

      function tick() {
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        parts = parts.filter((p) => p.y < innerHeight + 50); // drop off-screen ones

        for (const p of parts) {
          p.vy += 0.4; // gravity
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.99; // air drag
          p.rot += p.vr;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.font = `${p.size}px serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(p.emoji, 0, 0);
          ctx.restore();
        }

        if (parts.length) requestAnimationFrame(tick);
        else running = false; // stop the loop when empty
      }

      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
          e.preventDefault();
          save();
          confetti();
        }
      });

      const $ = (id) => document.getElementById(id);

      // -- RESET --
      $("reset").addEventListener("click", () => {
        if (!confirm("Clear all accounts and transactions? Cannot be undone."))
          return;
        localStorage.removeItem(KEY);
        location.reload();
      });

      // -- EXPORT --
      $("export").addEventListener("click", exportCsv);
      $("import-btn").addEventListener("click", () => $("import-file").click());
      $("import-file").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          if (!confirm("Replace current data with the imported file?")) return;
          importCsv(reader.result);
          save();
        };
        reader.readAsText(file);
        e.target.value = ""; // lets you re-import the same file later
      });

      // ── PERSISTENCE ──
      const KEY = "finance-app";
      let collapsedGroups = {};
      let disabledGroups = {};

      function save() {
        localStorage.setItem(
          KEY,
          JSON.stringify({
            accounts,
            transactions,
            years: +$("years").value,
            startYear: +$("start-year").value || null,
            collapsedGroups,
            disabledGroups,
          }),
        );
      }

      function load() {
        const raw = localStorage.getItem(KEY);
        if (!raw) return;
        try {
          const d = JSON.parse(raw);
          if (d.accounts) accounts = d.accounts;
          if (d.transactions) transactions = d.transactions;
          if (d.years != null) $("years").value = d.years;
          if (d.startYear != null) $("start-year").value = d.startYear;
          if (d.collapsedGroups) collapsedGroups = d.collapsedGroups;
          if (d.disabledGroups) disabledGroups = d.disabledGroups;
        } catch {} // corrupt storage → ignore, use defaults
      }

      // every transaction needs a group bucket
      function ensureGroups() {
        transactions.forEach((t) => {
          if (t.group == null || t.group === "") t.group = "General";
        });
      }

      // ── ACCOUNT COLUMNS ──
      const ACC_COLS = [
        { key: "name", label: "Account", type: "text", def: "Account" },
        { key: "balance", label: "Balance $", type: "number", def: 1000 },
        { key: "rate", label: "Annual Rate %", type: "number", def: 5 },
        { key: "overdraft", label: "Overdraft?", type: "checkbox", def: false },
        { key: "limit", label: "Limit", type: "number", def: 0 },
      ];
      let accounts = [
        { name: "Savings", balance: 1000, rate: 4, monthly: 200 },
        { name: "Index", balance: 5000, rate: 8, monthly: 300 },
      ];

      // ── TRANSACTION COLUMNS ──

      const TX_COLS = [
        {
          key: "group",
          label: "Group",
          type: "text",
          def: "General",
          hidden: true,
        },
        { key: "name", label: "Name", type: "text", def: "Transaction" },
        {
          key: "amount",
          label: "Amount $",
          type: "number",
          def: 100,
          step: 100,
          stepBig: 1000,
        },
        { key: "every", label: "Per N mo", type: "number", def: 12 },
        {
          key: "start",
          label: "Start (M/Y)",
          type: "text",
          def: "1/2026",
          month: true,
        },
        {
          key: "end",
          label: "End (M/Y)",
          type: "text",
          def: "12/2999",
          month: true,
        },
        {
          key: "source",
          label: "Source",
          type: "select",
          options: () => ["World", ...accounts.map((a) => a.name), "World"],
          def: "World",
        },
        {
          key: "dest",
          label: "Destination",
          type: "select",
          options: () => ["World", ...accounts.map((a) => a.name), "World"],
          def: "Savings",
        },
      ];
      let transactions = [
        {
          name: "Bonus",
          amount: 2000,
          every: 12,
          start: "6/2026",
          end: "6/2035",
        },
      ];

      let zeroCrossings = []; // [{ account, x }]  x is in year units

      function cell(c, r, i) {
        if (c.type === "checkbox") {
          return `<input type="checkbox" data-i="${i}" data-key="${c.key}" ${r[c.key] ? "checked" : ""}>`;
        }
        if (c.type === "select") {
          const opts = c
            .options()
            .map(
              (o) =>
                `<option ${o === r[c.key] ? "selected" : ""}>${o}</option>`,
            )
            .join("");
          return `<select data-i="${i}" data-key="${c.key}">${opts}</select>`;
        }
        return `<input data-i="${i}" data-key="${c.key}" type="${c.type}" value="${r[c.key]}">`;
      }

      const IS_MAC = /Mac|iPhone|iPad|iPod/.test(
        navigator.platform || navigator.userAgent || "",
      );
      const MOD = IS_MAC ? "⌘⇧" : "Ctrl+Shift+";
      const SC_LABEL = {
        add: IS_MAC ? "⇧⏎" : "Shift+Enter",
        up: MOD + "↑",
        down: MOD + "↓",
        top: MOD + (IS_MAC ? "↖" : "Home"),
        bottom: MOD + (IS_MAC ? "↘" : "End"),
        prevgrp: (IS_MAC ? "⌥⇧" : "Alt+Shift+") + "↑",
        nextgrp: (IS_MAC ? "⌥⇧" : "Alt+Shift+") + "↓",
        del: MOD + (IS_MAC ? "⌫" : "Bksp"),
      };

      // shift a "M/Y" string by whole months / years (returns null if unparseable)
      function bumpMY(val, dMonth, dYear) {
        const [ms, ys] = String(val).split("/");
        let m = parseInt(ms, 10),
          y = parseInt(ys, 10);
        if (!Number.isFinite(m) || !Number.isFinite(y)) return null;
        m += dMonth;
        y += Math.floor((m - 1) / 12);
        m = ((((m - 1) % 12) + 12) % 12) + 1;
        y += dYear;
        return m + "/" + y;
      }

      const escAttr = (s) =>
        String(s)
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");

      function makeGrid(
        headId,
        bodyId,
        addId,
        cols,
        rows,
        refresh,
        onEdit,
        opts,
      ) {
        opts = opts || {};
        const groupBy = opts.groupBy;
        const collapsed = opts.collapsed || {};
        const disabled = opts.disabled || {};
        const onCollapseChange = opts.onCollapseChange;
        const visCols = cols.filter((c) => !c.hidden);

        $(headId).innerHTML =
          visCols.map((c) => `<th>${c.label}</th>`).join("") + "<th></th>";

        function renderFlat() {
          $(bodyId).innerHTML = rows
            .map(
              (r, i) => `
            <tr>
              ${visCols.map((c) => `<td>${cell(c, r, i)}</td>`).join("")}
              <td><button data-del="${i}">✕</button></td>
            </tr>`,
            )
            .join("");
        }

        function renderGrouped() {
          const span = visCols.length + 1;
          const order = [],
            map = {};
          rows.forEach((r, i) => {
            const g =
              r[groupBy] == null || r[groupBy] === "" ? "General" : r[groupBy];
            if (!(g in map)) {
              map[g] = [];
              order.push(g);
            }
            map[g].push(i);
          });

          let html = "";
          for (const g of order) {
            const off = !!collapsed[g];
            const dead = !!disabled[g];
            html += `<tr class="group-head${dead ? " grp-disabled" : ""}" data-group="${escAttr(g)}">
              <td colspan="${span}">
                <div class="head-inner">
                  <span class="caret" data-toggle="${escAttr(g)}">${off ? "▶" : "▼"}</span>
                  <input class="group-name" data-group="${escAttr(g)}" value="${escAttr(g)}">
                  <span class="group-tools">
                    <label class="grp-active-wrap" title="Include this group in the projection">
                      <input type="checkbox" class="grp-active" data-group="${escAttr(g)}"${dead ? "" : " checked"}>
                      active
                    </label>
                    <button class="grp-up" data-group="${escAttr(g)}" title="Move group up">▲</button>
                    <button class="grp-down" data-group="${escAttr(g)}" title="Move group down">▼</button>
                  </span>
                </div>
              </td>
            </tr>`;
            for (const i of map[g]) {
              html += `<tr class="grp-row${dead ? " grp-disabled" : ""}"${off ? ' style="display:none"' : ""}>
              ${visCols.map((c) => `<td>${cell(c, rows[i], i)}</td>`).join("")}
              <td class="row-actions">
                <details class="row-menu">
                  <summary title="Actions">⋯</summary>
                  <div class="menu">
                    <button data-act="add" data-i="${i}">＋ Add row below<span class="sc">${SC_LABEL.add}</span></button>
                    <div class="sep"></div>
                    <button data-act="up" data-i="${i}">↑ Move up<span class="sc">${SC_LABEL.up}</span></button>
                    <button data-act="down" data-i="${i}">↓ Move down<span class="sc">${SC_LABEL.down}</span></button>
                    <button data-act="top" data-i="${i}">⤒ Move to top<span class="sc">${SC_LABEL.top}</span></button>
                    <button data-act="bottom" data-i="${i}">⤓ Move to bottom<span class="sc">${SC_LABEL.bottom}</span></button>
                    <div class="sep"></div>
                    <button data-act="prevgrp" data-i="${i}">↰ Prev group<span class="sc">${SC_LABEL.prevgrp}</span></button>
                    <button data-act="nextgrp" data-i="${i}">↳ Next group<span class="sc">${SC_LABEL.nextgrp}</span></button>
                    <div class="sep"></div>
                    <button class="danger" data-act="del" data-i="${i}">✕ Delete<span class="sc">${SC_LABEL.del}</span></button>
                  </div>
                </details>
              </td>
            </tr>`;
            }
          }
          $(bodyId).innerHTML = html;
        }

        const render = groupBy ? renderGrouped : renderFlat;

        $(bodyId).addEventListener("input", (e) => {
          const { i, key } = e.target.dataset;
          if (i == null) return;
          const col = cols.find((c) => c.key === key);
          const val =
            col.type === "number"
              ? +e.target.value
              : col.type === "checkbox"
                ? e.target.checked
                : e.target.value;
          const old = rows[i][key];
          rows[i][key] = val;
          if (onEdit) onEdit(key, old, val);
          refresh();
        });

        // group controls (only fire when grouped markup is present)
        $(bodyId).addEventListener("click", (e) => {
          const t = e.target;
          if (t.classList.contains("caret")) {
            const g = t.dataset.toggle;
            collapsed[g] = !collapsed[g];
            render();
            if (onCollapseChange) onCollapseChange();
            return;
          }
          if (t.classList.contains("grp-up")) {
            moveGroup(t.dataset.group, -1);
            return;
          }
          if (t.classList.contains("grp-down")) {
            moveGroup(t.dataset.group, 1);
          }
        });

        // toggle a whole group in/out of the projection
        $(bodyId).addEventListener("change", (e) => {
          if (!e.target.classList.contains("grp-active")) return;
          const g = e.target.dataset.group;
          if (e.target.checked) delete disabled[g];
          else disabled[g] = true;
          render(); // dim/undim rows
          refresh(); // recompute chart + save
        });

        // rename a whole group (commit on blur / Enter)
        $(bodyId).addEventListener("change", (e) => {
          if (!e.target.classList.contains("group-name")) return;
          const oldG = e.target.dataset.group;
          const newG = e.target.value.trim() || "General";
          if (newG === oldG) return;
          rows.forEach((r) => {
            const g =
              r[groupBy] == null || r[groupBy] === "" ? "General" : r[groupBy];
            if (g === oldG) r[groupBy] = newG;
          });
          if (oldG in collapsed) {
            collapsed[newG] = collapsed[oldG];
            delete collapsed[oldG];
          }
          if (oldG in disabled) {
            disabled[newG] = disabled[oldG];
            delete disabled[oldG];
          }
          render();
          refresh();
        });

        // ── group-aware move helpers (operate on the flat rows array) ──
        const gOf = (r) =>
          r[groupBy] == null || r[groupBy] === "" ? "General" : r[groupBy];
        const idxOfGroup = (g) =>
          rows
            .map((r, k) => [r, k])
            .filter(([r]) => gOf(r) === g)
            .map(([, k]) => k);
        const groupSeq = () => {
          const seen = [];
          rows.forEach((r) => {
            const g = gOf(r);
            if (!seen.includes(g)) seen.push(g);
          });
          return seen;
        };
        // reorder whole groups by rebuilding rows in the new group order
        function moveGroup(g, dir) {
          const seq = groupSeq();
          const gi = seq.indexOf(g);
          const ti = gi + dir;
          if (ti < 0 || ti >= seq.length) return; // already at the edge
          [seq[gi], seq[ti]] = [seq[ti], seq[gi]];
          const buckets = {};
          seq.forEach((n) => (buckets[n] = []));
          rows.forEach((r) => buckets[gOf(r)].push(r));
          const flat = [];
          seq.forEach((n) => buckets[n].forEach((r) => flat.push(r)));
          rows.length = 0;
          flat.forEach((r) => rows.push(r));
          render();
          refresh();
        }
        // pull rows[from] out and reinsert before current rows[before] (before===len → end)
        function moveRowTo(from, before) {
          const r = rows[from];
          rows.splice(from, 1);
          let t = from < before ? before - 1 : before;
          t = Math.max(0, Math.min(rows.length, t));
          rows.splice(t, 0, r);
        }
        function moveWithin(i, dir) {
          const g = gOf(rows[i]);
          const idxs = idxOfGroup(g);
          const pos = idxs.indexOf(i);
          if (dir < 0) {
            if (pos > 0)
              moveRowTo(i, idxs[pos - 1]); // swap up
            else crossGroup(i, -1); // top of group → previous group
          } else {
            if (pos < idxs.length - 1)
              moveRowTo(i, idxs[pos + 1] + 1); // swap down
            else crossGroup(i, 1); // bottom of group → next group
          }
        }
        function moveEdge(i, which) {
          const idxs = idxOfGroup(gOf(rows[i]));
          if (which === "top") moveRowTo(i, idxs[0]);
          else moveRowTo(i, idxs[idxs.length - 1] + 1);
        }
        function crossGroup(i, dir) {
          const seq = groupSeq();
          const gi = seq.indexOf(gOf(rows[i]));
          const tgt = seq[gi + dir];
          if (tgt == null) return; // no neighbour group → no-op
          const members = idxOfGroup(tgt);
          if (dir > 0) {
            // land at TOP of next group
            const before = members[0];
            rows[i][groupBy] = tgt;
            moveRowTo(i, before);
          } else {
            // land at BOTTOM of previous group
            const before = members[members.length - 1] + 1;
            rows[i][groupBy] = tgt;
            moveRowTo(i, before);
          }
        }
        function doAction(i, act) {
          if (i < 0 || i >= rows.length) return;
          if (act === "add") {
            addRow(gOf(rows[i]), i); // self-renders + focuses new row
            return;
          }
          if (act === "del") rows.splice(i, 1);
          else if (act === "up") moveWithin(i, -1);
          else if (act === "down") moveWithin(i, 1);
          else if (act === "top") moveEdge(i, "top");
          else if (act === "bottom") moveEdge(i, "bottom");
          else if (act === "prevgrp") crossGroup(i, -1);
          else if (act === "nextgrp") crossGroup(i, 1);
          render();
          refresh();
        }

        // menu actions
        $(bodyId).addEventListener("click", (e) => {
          const btn = e.target.closest("button[data-act]");
          if (!btn) return;
          doAction(+btn.dataset.i, btn.dataset.act);
        });

        $(bodyId).addEventListener("click", (e) => {
          if (e.target.dataset.del == null) return;
          rows.splice(+e.target.dataset.del, 1);
          render();
          refresh();
        });
        // add a row; optionally into a specific group, right after afterIndex
        function addRow(group, afterIndex) {
          const row = Object.fromEntries(cols.map((c) => [c.key, c.def]));
          if (groupBy && group != null) row[groupBy] = group;
          if (afterIndex != null && afterIndex >= 0)
            rows.splice(afterIndex + 1, 0, row);
          else rows.push(row);
          render();
          refresh();
          // focus + select the first editable cell of the row we just added
          const ni = rows.indexOf(row);
          const first = $(bodyId).querySelector(`[data-i="${ni}"]`);
          if (first) {
            first.focus();
            if (first.select) first.select();
          }
        }

        $(addId).addEventListener("click", () => addRow());
        render();

        const SC_KEYS = {
          ArrowUp: "up",
          ArrowDown: "down",
          Home: "top",
          End: "bottom",
          Backspace: "del",
        };

        $(bodyId).addEventListener("keydown", (e) => {
          if (e.target.classList.contains("group-name")) return;

          // Stepped columns (e.g. Amount): Shift+↑/↓ = ±step,
          // Ctrl/Cmd+Shift+↑/↓ = ±stepBig. Takes priority over row-move here.
          {
            const el = e.target;
            const key = el.dataset && el.dataset.key;
            const col = key && cols.find((c) => c.key === key);
            if (
              col &&
              col.step &&
              e.shiftKey &&
              !e.altKey &&
              (e.key === "ArrowUp" || e.key === "ArrowDown")
            ) {
              const big = e.ctrlKey || e.metaKey;
              const delta =
                (e.key === "ArrowUp" ? 1 : -1) * (big ? col.stepBig : col.step);
              e.preventDefault();
              const next = (+el.value || 0) + delta;
              el.value = next;
              rows[+el.dataset.i][key] = next;
              refresh();
              return;
            }
          }

          // Ctrl/Cmd+Shift+<key> → row actions (grouped grids only)
          if (
            groupBy &&
            (e.ctrlKey || e.metaKey) &&
            e.shiftKey &&
            SC_KEYS[e.key]
          ) {
            const cell = e.target.closest("[data-i]");
            if (!cell) return;
            e.preventDefault();
            const obj = rows[+cell.dataset.i];
            const key = cell.dataset.key;
            doAction(+cell.dataset.i, SC_KEYS[e.key]);
            // keep focus on the same field of the moved row (skip if deleted)
            const ni = rows.indexOf(obj);
            if (ni >= 0 && key) {
              const back = $(bodyId).querySelector(
                `[data-i="${ni}"][data-key="${key}"]`,
              );
              if (back) back.focus();
            }
            return;
          }

          // Alt+Shift+Up/Down → jump to prev/next group
          if (
            groupBy &&
            e.altKey &&
            e.shiftKey &&
            (e.key === "ArrowUp" || e.key === "ArrowDown")
          ) {
            const cell = e.target.closest("[data-i]");
            if (!cell) return;
            e.preventDefault();
            const obj = rows[+cell.dataset.i];
            const key = cell.dataset.key;
            doAction(
              +cell.dataset.i,
              e.key === "ArrowUp" ? "prevgrp" : "nextgrp",
            );
            const ni = rows.indexOf(obj);
            if (ni >= 0 && key) {
              const back = $(bodyId).querySelector(
                `[data-i="${ni}"][data-key="${key}"]`,
              );
              if (back) back.focus();
            }
            return;
          }

          // Ctrl/Cmd+Arrow (no shift) → move to prev/next row, same column.
          if (
            (e.ctrlKey || e.metaKey) &&
            !e.shiftKey &&
            (e.key === "ArrowUp" || e.key === "ArrowDown")
          ) {
            const el = e.target;
            const key = el.dataset && el.dataset.key;
            if (!key) return;
            e.preventDefault();
            const dir = e.key === "ArrowUp" ? -1 : 1;
            const fields = [
              ...$(bodyId).querySelectorAll(`[data-key="${key}"]`),
            ].filter((f) => f.offsetParent !== null); // skip collapsed/hidden rows
            const target = fields[fields.indexOf(el) + dir];
            if (target) {
              target.focus();
              if (target.select) target.select();
            }
            return;
          }

          // Month columns: ↑/↓ = ±1 month, Shift+↑/↓ = ±1 year
          if (
            !e.ctrlKey &&
            !e.metaKey &&
            !e.altKey &&
            (e.key === "ArrowUp" || e.key === "ArrowDown")
          ) {
            const el = e.target;
            const key = el.dataset && el.dataset.key;
            const col = cols.find((c) => c.key === key);
            if (col && col.month) {
              const dir = e.key === "ArrowUp" ? 1 : -1;
              const next = e.shiftKey
                ? bumpMY(el.value, 0, dir)
                : bumpMY(el.value, dir, 0);
              if (next != null) {
                e.preventDefault();
                el.value = next;
                rows[+el.dataset.i][key] = next;
                refresh();
                return;
              }
            }
          }

          if (e.key === "Enter" && e.shiftKey) {
            // ← Shift + Enter: add a row inside the currently focused group
            e.preventDefault();
            if (groupBy) {
              const cell = e.target.closest("[data-i]");
              if (cell) {
                const i = +cell.dataset.i;
                addRow(gOf(rows[i]), i);
                return;
              }
            }
            addRow();
          }
        });

        return render; // ← expose render
      }

      // ── DATE: "M/Y" → month offset from projection start (now) ──
      const NOW = new Date();
      const baseY = NOW.getFullYear(),
        baseM = NOW.getMonth() + 1;
      function offset(my) {
        const [m, y] = String(my).split("/").map(Number);
        return (y - baseY) * 12 + (m - baseM);
      }

      // display-only: left edge of the chart, as a month index from now.
      // "start year" crops the view to begin at January of that year; it
      // never changes the underlying projection. Clamped into range.
      function startMonthIndex() {
        const years = +$("years").value || 0;
        const Y = +$("start-year").value;
        if (!Number.isFinite(Y) || Y <= baseY) return 0;
        const idx = (Y - baseY) * 12 + (1 - baseM); // Jan of year Y
        return Math.max(0, Math.min(idx, years * 12));
      }

      // ── MATH ──

      function buildData() {
        const STEP = 1; // months per chart point: 1 = monthly, 3 = quarterly, 12 = yearly
        const years = +$("years").value || 0;
        const labels = [];
        for (let m = 0; m <= years * 12; m += STEP) {
          const total = baseM - 1 + m;
          labels.push(`${(total % 12) + 1}/${baseY + Math.floor(total / 12)}`); // "6/2026"
        }
        const bal = {},
          rate = {},
          limit = {},
          hasLimit = {},
          out = {},
          noNeg = {};
        for (const a of accounts) {
          bal[a.name] = +a.balance || 0;
          rate[a.name] = (+a.rate || 0) / 100 / 12;
          limit[a.name] = +a.limit || 0;
          // limit is active if it's non-zero, OR the account starts negative
          // (a debt being paid down) — there 0 means "don't pass zero",
          // not "unset". Accounts that start positive keep 0 = unset.
          hasLimit[a.name] = limit[a.name] !== 0 || bal[a.name] < 0;
          out[a.name] = [];
          noNeg[a.name] = !a.overdraft;
        }
        const exists = (name) => name !== "world" && bal[name] !== undefined;
        const isFull = (name) =>
          exists(name) && hasLimit[name] && bal[name] >= limit[name];

        // ── per-transaction fire pointers ──
        const ev = transactions.map((t) => +t.every || 1); // interval in months (fractions OK)
        const fire = transactions.map((t) => offset(t.start)); // next fire time, in months
        const endAt = transactions.map((t) => offset(t.end));

        const firstNeg = {};

        for (let m = 0; m <= years * 12; m++) {
          if (m > 0) {
            for (const a of accounts)
              bal[a.name] =
                bal[a.name] * (1 + rate[a.name]) + (+a.monthly || 0);

            transactions.forEach((t, k) => {
              if (ev[k] <= 0) return; // guard against 0 / negative → infinite loop
              if (disabledGroups[t.group || "General"]) return; // group switched off
              // fire every occurrence that lands at or before this month

              while (fire[k] <= m && fire[k] <= endAt[k]) {
                const amt = +t.amount || 0;
                const blocked =
                  isFull(t.dest) || // dest at limit
                  (exists(t.source) &&
                    noNeg[t.source] &&
                    bal[t.source] - amt < 0); // would overdraw
                if (!blocked || t.source == "World") {
                  if (exists(t.source)) bal[t.source] -= amt;
                  if (exists(t.dest)) bal[t.dest] += amt;
                }
                fire[k] += ev[k];
              }
            });
            // record first below-zero crossing
            for (const a of accounts) {
              if (
                firstNeg[a.name] === undefined &&
                (Math.abs(bal[a.name]) < 500 ||
                  (!noNeg[a.name] && bal[a.name] < 0))
              )
                // Note: Near-zero is considered within 500 zero
                firstNeg[a.name] = m;
            }
          }
          if (m % STEP === 0)
            for (const a of accounts) out[a.name].push(Math.round(bal[a.name]));
        }

        zeroCrossings = accounts
          .filter((a) => firstNeg[a.name] !== undefined)
          .map((a) => ({ account: a.name, x: firstNeg[a.name] / STEP }));

        // show points when the *visible* window is short (≤ ~2 years),
        // so cropping with "start year" re-enables them too
        const visibleMonths = years * 12 - startMonthIndex();
        const showPoints = visibleMonths <= 24;

        return {
          labels,
          datasets: accounts.map((a) => ({
            label: a.name,
            data: out[a.name],
            fill: true,
            tension: 0.2,
            pointRadius: showPoints ? undefined : 0,
          })),
        };
      }

      load();
      ensureGroups();
      if (!$("start-year").value) $("start-year").value = baseY; // default = now

      const zeroCrossPlugin = {
        id: "zeroCross",
        afterDatasetsDraw(chart) {
          const { ctx, chartArea, scales } = chart;
          const xScale = scales.x;

          zeroCrossings.forEach((c, idx) => {
            // pixel X for a fractional year (interpolate between integer-year ticks)
            const lo = Math.floor(c.x),
              hi = Math.ceil(c.x);
            const pLo = xScale.getPixelForValue(lo);
            const pHi = xScale.getPixelForValue(hi);
            const px = lo === hi ? pLo : pLo + (pHi - pLo) * (c.x - lo);
            if (px < chartArea.left - 0.5 || px > chartArea.right + 0.5) return; // off-screen (cropped)

            ctx.save();
            const red = mqDark.matches
              ? "rgba(255,110,110,0.95)"
              : "rgba(200,0,0,.8)";
            ctx.strokeStyle = red;
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(px, chartArea.top);
            ctx.lineTo(px, chartArea.bottom);
            ctx.stroke();

            ctx.setLineDash([]);
            ctx.fillStyle = red;
            ctx.font = "11px sans-serif";
            ctx.textAlign = "center";
            // stagger labels vertically so multiple crossings don't overlap
            ctx.fillText(
              `${c.account} → $0`,
              px,
              chartArea.top + 12 + idx * 14,
            );
            ctx.restore();
          });
        },
      };

      const mqDark = matchMedia("(prefers-color-scheme: dark)");
      Chart.defaults.color = mqDark.matches ? "#cfd2d6" : "#333";
      const chart = new Chart($("chart"), {
        type: "line",
        data: buildData(),
        plugins: [zeroCrossPlugin],
        options: {
          scales: {
            x: { ticks: { autoSkip: true, maxTicksLimit: 12 } },
            y: {
              stacked: true,
              ticks: { callback: (v) => "$" + v.toLocaleString() },
            },
          },
          plugins: {
            legend: {
              onClick(e, legendItem, legend) {
                const ci = legend.chart;
                const idx = legendItem.datasetIndex;

                if (!e.native.shiftKey) {
                  // plain click = default deselect
                  Chart.defaults.plugins.legend.onClick.call(
                    this,
                    e,
                    legendItem,
                    legend,
                  );
                  return;
                }
                // shift-click = isolate / restore
                const visible = ci.data.datasets.map((_, i) =>
                  ci.isDatasetVisible(i),
                );
                const isolated =
                  visible[idx] && visible.every((v, i) => (i === idx ? v : !v));
                ci.data.datasets.forEach((_, i) =>
                  ci.setDatasetVisibility(i, isolated ? true : i === idx),
                );
                ci.update();
              },
            },
          },
        },
      });

      // display-only crop: set the x-axis left edge from "start year"
      function applyCrop() {
        const idx = startMonthIndex();
        chart.options.scales.x.min = idx > 0 ? idx : undefined;
      }
      function themeChart() {
        const dark = mqDark.matches;
        Chart.defaults.color = dark ? "#cfd2d6" : "#333";
        const grid = dark ? "rgba(255,255,255,0.09)" : "rgba(0,0,0,0.08)";
        const x = chart.options.scales.x,
          y = chart.options.scales.y;
        x.grid = { ...(x.grid || {}), color: grid };
        y.grid = { ...(y.grid || {}), color: grid };
        x.ticks = { ...(x.ticks || {}), color: Chart.defaults.color };
        y.ticks = { ...(y.ticks || {}), color: Chart.defaults.color };
        chart.options.plugins.legend.labels = {
          ...(chart.options.plugins.legend.labels || {}),
          color: Chart.defaults.color,
        };
        chart.update();
      }
      mqDark.addEventListener("change", themeChart);
      themeChart();
      applyCrop();
      chart.update();

      function refresh() {
        // remember hidden series, keyed by label
        const wasHidden = {};
        chart.data.datasets.forEach((ds, i) => {
          if (!chart.isDatasetVisible(i)) wasHidden[ds.label] = true;
        });

        chart.data = buildData();

        // reapply visibility by matching label
        chart.data.datasets.forEach((ds, i) => {
          chart.setDatasetVisibility(i, !wasHidden[ds.label]);
        });

        applyCrop();
        chart.update();
        save();
      }
      // wire both tables with the same function
      const renderTx = makeGrid(
        "tx-head",
        "tx-rows",
        "tx-add",
        TX_COLS,
        transactions,
        refresh,
        null,
        {
          groupBy: "group",
          collapsed: collapsedGroups,
          disabled: disabledGroups,
          onCollapseChange: save,
        },
      );

      const renderAcc = makeGrid(
        "acc-head",
        "acc-rows",
        "acc-add",
        ACC_COLS,
        accounts,
        refresh,
        (key, old, val) => {
          if (key !== "name") return;
          transactions.forEach((t) => {
            if (t.dest === old) t.dest = val;
            if (t.source === old) t.source = val;
          }); // re-point txs
          renderTx(); // redraw tx table → dropdown options + selected values update
        },
      );
      $("years").addEventListener("input", refresh);
      $("start-year").addEventListener("input", refresh);

      // + Group → make a fresh empty-ish group (one starter row, expanded)
      $("tx-add-group").addEventListener("click", () => {
        let n = 1,
          name;
        do {
          name = "Group " + n++;
        } while (transactions.some((t) => (t.group || "General") === name));
        const row = Object.fromEntries(TX_COLS.map((c) => [c.key, c.def]));
        row.group = name;
        transactions.push(row);
        collapsedGroups[name] = false;
        renderTx();
        refresh();
      });

      // single open menu + close on outside click
      document.addEventListener("click", (e) => {
        document.querySelectorAll("details.row-menu[open]").forEach((d) => {
          if (!d.contains(e.target)) d.removeAttribute("open");
        });
      });

      // CSV HElpers
      // ── CSV ──
      // one file, two labeled sections; column order driven by the configs
      function escCsv(v) {
        v = v == null ? "" : String(v);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }
      function toCsv(cols, rows) {
        const head = cols.map((c) => c.key).join(",");
        const body = rows
          .map((r) => cols.map((c) => escCsv(r[c.key])).join(","))
          .join("\n");
        return head + "\n" + body;
      }

      function exportCsv() {
        const text =
          "[accounts]\n" +
          toCsv(ACC_COLS, accounts) +
          "\n\n" +
          "[transactions]\n" +
          toCsv(TX_COLS, transactions) +
          "\n";
        const blob = new Blob([text], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const a = Object.assign(document.createElement("a"), {
          href: url,
          download: "finance.csv",
        });
        a.click();
        URL.revokeObjectURL(url);
      }

      // parse one CSV line, respecting quoted fields
      function parseLine(line) {
        const out = [];
        let cur = "",
          q = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (q) {
            if (ch === '"') {
              if (line[i + 1] === '"') {
                cur += '"';
                i++;
              } else q = false;
            } else cur += ch;
          } else if (ch === '"') q = true;
          else if (ch === ",") {
            out.push(cur);
            cur = "";
          } else cur += ch;
        }
        out.push(cur);
        return out;
      }

      function parseSection(lines, cols) {
        if (!lines.length) return [];
        const header = parseLine(lines[0]).map((h) => h.trim());
        return lines
          .slice(1)
          .filter((l) => l.trim())
          .map((line) => {
            const vals = parseLine(line);
            const obj = {};
            for (const c of cols) {
              const idx = header.indexOf(c.key);
              let v = idx >= 0 ? vals[idx] : c.def;
              obj[c.key] =
                c.type === "number"
                  ? +v || 0
                  : c.type === "checkbox"
                    ? v === "true" || v === true || v === "1"
                    : v;
            }
            return obj;
          });
      }

      function importCsv(text) {
        const lines = text.split(/\r?\n/);
        let section = null,
          buf = [],
          acc = [],
          tx = [];
        const flush = () => {
          if (section === "accounts") acc = parseSection(buf, ACC_COLS);
          if (section === "transactions") tx = parseSection(buf, TX_COLS);
          buf = [];
        };
        for (const line of lines) {
          const m = line.trim().match(/^\[(\w+)\]$/);
          if (m) {
            flush();
            section = m[1];
            continue;
          }
          if (line.trim() === "") continue;
          buf.push(line);
        }
        flush();

        // mutate in place — makeGrid holds these array references
        accounts.length = 0;
        acc.forEach((r) => accounts.push(r));
        transactions.length = 0;
        tx.forEach((r) => transactions.push(r));

        renderAcc();
        renderTx();
        refresh();
      }
    </script>
  </body>
</html>
